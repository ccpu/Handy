# Personal Windows x64 build for this fork. Unsigned, no secrets, read-only token.
# Lives in its own file so upstream merges never touch it.
# Only GitHub-owned actions, pinned by commit SHA; every download is pinned too.
name: My Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: my-windows-build
  cancel-in-progress: true

env:
  VULKAN_VERSION: 1.4.309.0
  VULKAN_SHA256: 48b132169b64fe65cdb0f20970195335a65354e73f1ea5373032c2a8bbad4297
  BUN_VERSION: 1.4.4

jobs:
  build:
    # Never run in upstream or any other copy of this file.
    if: github.repository_owner != 'cjpais'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        run: npm install -g bun@${{ env.BUN_VERSION }}

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "$env:RUNNER_TEMP\VulkanSDK.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/VulkanSDK-$env:VULKAN_VERSION-Installer.exe" -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:VULKAN_SHA256) { throw "Vulkan SDK checksum mismatch: $hash" }
          $root = "C:\VulkanSDK\$env:VULKAN_VERSION"
          & $exe --root $root --accept-licenses --default-answer --confirm-command install | Out-Host
          if (-not (Test-Path "$root\Bin\glslc.exe")) { throw "Vulkan SDK install failed" }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=$root"
          Add-Content $env:GITHUB_PATH "$root\Bin"

      # Same as upstream CI: ggml-vulkan needs a findable SPIRV-HeadersConfig.cmake.
      - name: Install SPIRV-Headers
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$prefix"

      - name: Download VAD model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/resources/models | Out-Null
          Invoke-WebRequest "https://huggingface.co/handy-computer/silero-vad-v6.2-gguf/resolve/main/silero-vad-v6.2-F32.gguf" -OutFile src-tauri/resources/models/silero-vad-v6.2-F32.gguf

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Upstream signs with its own Azure certificate and updater key; drop both.
      - name: Build
        shell: pwsh
        run: |
          '{"bundle":{"createUpdaterArtifacts":false,"windows":{"signCommand":null}}}' |
            Set-Content "$env:RUNNER_TEMP\local-build.json"
          bun run tauri build --config "$env:RUNNER_TEMP\local-build.json"
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed" }

      - name: Print installer checksums
        shell: pwsh
        run: Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, src-tauri/target/release/bundle/msi/*.msi | Get-FileHash -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handy-windows-x64-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14
          if-no-files-found: error
